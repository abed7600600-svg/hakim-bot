name: 24/7 Guaranteed Live Stream - Abed Alhakim

on:
  schedule:
    - cron: '0 */5 * * *'  # إعادة تشغيل سحابية تلقائية كل 5 ساعات
  workflow_dispatch:        # تشغيل فوري

jobs:
  nonstop-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تشغيل البث المباشر
        run: |
          python -c "
          import urllib.request, urllib.parse, json, time

          BOT_TOKEN = '8641484254:AAGs6MFyxo52A_Y2bkznogpZ9-s9g6NbjXk'
          CHAT_ID = '8493446835'

          def send_telegram(text):
              url = f'https://api.telegram.org/bot{BOT_TOKEN}/sendMessage'
              data = json.dumps({'chat_id': CHAT_ID, 'text': text}).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      print('Message delivered to Telegram')
              except Exception as e:
                  print('Telegram Error:', e)

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode('utf-8'))

          def translate_to_ar(text):
              try:
                  q = urllib.parse.quote(text[:250])
                  url = f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q={q}'
                  res = get_json(url)
                  return ''.join([i[0] for i in res[0] if i[0]])
              except Exception:
                  return text

          def calculate_rsi(closes, period=14):
              if len(closes) < period + 1: return 50
              deltas = [closes[i] - closes[i-1] for i in range(1, len(closes))]
              gains = [d if d > 0 else 0 for d in deltas]
              losses = [-d if d < 0 else 0 for d in deltas]
              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period
              for i in range(period, len(deltas)):
                  avg_gain = (avg_gain * (period - 1) + gains[i]) / period
                  avg_loss = (avg_loss * (period - 1) + losses[i]) / period
              if avg_loss == 0: return 100
              return 100 - (100 / (1 + (avg_gain / avg_loss)))

          send_telegram('🔥 تم تفعيل البث الحي لمنظومة عبد الحكيم رائد بنجاح!\nجاري الآن بث الأخبار العالمية وفحص الصفقات بشكل متواصل...')

          news_idx = 0
          loop_count = 0

          while loop_count < 300:
              loop_count += 1

              # 1. بث الأخبار العالمية المترجمة
              try:
                  news_data = get_json('https://min-api.cryptocompare.com/data/v2/news/?lang=EN')
                  if 'Data' in news_data and len(news_data['Data']) > 0:
                      item = news_data['Data'][news_idx % len(news_data['Data'])]
                      source = item.get('source_info', {}).get('name', 'Crypto News')
                      t_en = item.get('title', '')
                      b_en = item.get('body', '')[:130] + '...'
                      link = item.get('url', '')

                      t_ar = translate_to_ar(t_en)
                      b_ar = translate_to_ar(b_en)

                      msg = (
                          f'📰 خبر عاجل | رادار عبد الحكيم رائد\n'
                          f'━━━━━━━━━━━━━━━━━━\n'
                          f'🌐 المصدر: {source}\n\n'
                          f'📌 العنوان: {t_ar}\n\n'
                          f'📝 التفاصيل: {b_ar}\n'
                          f'━━━━━━━━━━━━━━━━━━\n'
                          f'🔗 الرابط: {link}'
                      )
                      send_telegram(msg)
                      news_idx += 1
              except Exception as e:
                  print('News error:', e)

              time.sleep(15)

              # 2. فحص صفقات بينانس
              try:
                  tickers = get_json('https://fapi.binance.com/fapi/v1/ticker/24hr')
                  for t in tickers:
                      sym = t.get('symbol', '')
                      if sym.endswith('USDT') and float(t.get('priceChangePercent', 0)) >= 5.0:
                          try:
                              klines = get_json(f'https://fapi.binance.com/fapi/v1/klines?symbol={sym}&interval=15m&limit=50')
                              if len(klines) < 50: continue
                              opens = [float(k[1]) for k in klines]
                              highs = [float(k[2]) for k in klines]
                              closes = [float(k[4]) for k in klines]
                              vols = [float(k[5]) for k in klines]

                              last_o, last_h, last_c = opens[-1], highs[-1], closes[-1]
                              last_v = vols[-1]
                              past_c = closes[-8]
                              pump = ((last_h - past_c) / past_c) * 100
                              avg_v = sum(vols[-20:-1]) / 19
                              v_spike = last_v / avg_v if avg_v > 0 else 1
                              rsi_val = calculate_rsi(closes)
                              body = abs(last_c - last_o)
                              wick = last_h - max(last_o, last_c)

                              if pump >= 5.0 and v_spike >= 1.3 and rsi_val >= 68:
                                  if wick > (body * 0.3) or (last_c < last_h * 0.985):
                                      sl = round(last_h * 1.015, 4)
                                      tp1 = round(last_c - (last_h - past_c) * 0.382, 4)
                                      tp2 = round(last_c - (last_h - past_c) * 0.50, 4)

                                      sig_msg = (
                                          f'🚨 فرصة شورت مؤكدة (Signal Alert) 🚨\n'
                                          f'👑 منظومة عبد الحكيم رائد للتحليل\n'
                                          f'━━━━━━━━━━━━━━━━━━\n'
                                          f'📌 العملة: {sym}\n'
                                          f'📈 نسبة الصعود: +{pump:.1f}%\n'
                                          f'📊 مؤشر RSI: {rsi_val:.1f}\n'
                                          f'🌊 تدفق الفوليوم: {v_spike:.1f}x ضعف المعدل\n'
                                          f'━━━━━━━━━━━━━━━━━━\n'
                                          f'💰 سعر الدخول المقترح: {last_c}\n'
                                          f'🛑 وقف الخسارة (SL): {sl}\n'
                                          f'🎯 الهدف الأول: {tp1}\n'
                                          f'🎯 الهدف الثاني: {tp2}\n'
                                          f'━━━━━━━━━━━━━━━━━━\n'
                                          f'💡 نصيحة عبد الحكيم: الدخول بـ 1-2% فقط مع رافعة 3x-5x وتأمين الصفقة عند الهدف الأول.'
                                      )
                                      send_telegram(sig_msg)
                                      time.sleep(2)
                                      break
                          except Exception:
                              continue
              except Exception as e:
                  print('Scan error:', e)

              time.sleep(15)
          "
          
