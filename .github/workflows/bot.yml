name: 24/7 Nonstop Crypto Live Stream - Abed Alhakim

on:
  schedule:
    - cron: '0 */5 * * *'  # إعادة تشغيل تلقائية كل 5 ساعات لضمان بقائه حياً للأبد
  workflow_dispatch:        # تشغيل فوري

jobs:
  nonstop-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # تشغيل متواصل لمدة 5.5 ساعات لكل دورة
    steps:
      - name: تحميل أحدث إصدار
        uses: actions/checkout@v4

      - name: تجهيز بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تشغيل البث اللحظي المستمر
        run: |
          python -c "
          import urllib.request, urllib.parse, json, time
          from datetime import datetime

          BOT_TOKEN = '8641484254:AAGs6MFyxo52A_Y2bkznogpZ9-s9g6NbjXk'
          CHAT_ID = '8493446835'

          def send_telegram(text):
              url = f'https://api.telegram.org/bot{BOT_TOKEN}/sendMessage'
              data = json.dumps({'chat_id': CHAT_ID, 'text': text, 'parse_mode': 'Markdown'}).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r: pass
              except Exception as e:
                  print('Telegram Error:', e)

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read().decode('utf-8'))

          def translate_to_arabic(text):
              try:
                  encoded = urllib.parse.quote(text[:250])
                  url = f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q={encoded}'
                  res = get_json(url)
                  return ''.join([item[0] for item in res[0] if item[0]])
              except Exception:
                  return text

          def calculate_rsi(closes, period=14):
              if len(closes) < period + 1: return 50
              deltas = [closes[i] - closes[i-1] for i in range(1, len(closes))]
              gains = [d if d > 0 else 0 for d in deltas]
              losses = [-d if d < 0 else 0 for d in deltas]
              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period
              for i in range(period, len(deltas)):
                  avg_gain = (avg_gain * (period - 1) + gains[i]) / period
                  avg_loss = (avg_loss * (period - 1) + losses[i]) / period
              if avg_loss == 0: return 100
              return 100 - (100 / (1 + (avg_gain / avg_loss)))

          seen_news_ids = set()
          news_index = 0

          # رسالة انطلاق البث
          send_telegram('🔥 *تم تفعيل البث الحي المتواصل 24/7 (أخبار وصفقات كل 30 ثانية)*\n👑 *منظومة عبد الحكيم رائد للرصد الشامل*\nالسيرفر السحابي يعمل الآن بدون أي توقف...')

          while True:
              now_str = datetime.utcnow().strftime('%H:%M:%S UTC')

              # 1. إرسال أحدث الأخبار العالمية المترجمة
              try:
                  news_data = get_json('https://min-api.cryptocompare.com/data/v2/news/?lang=EN')
                  if 'Data' in news_data and len(news_data['Data']) > 0:
                      article = news_data['Data'][news_index % len(news_data['Data'])]
                      news_id = article.get('id')
                      
                      source = article.get('source_info', {}).get('name', 'Global News')
                      title_en = article.get('title', '')
                      body_en = article.get('body', '')[:140] + '...'
                      news_url = article.get('url', '')

                      title_ar = translate_to_arabic(title_en)
                      body_ar = translate_to_arabic(body_en)

                      news_msg = (
                          f'📰 *خبر عالمي عاجل | رادار عبد الحكيم رائد*\n'
                          f'━━━━━━━━━━━━━━━━━━\n'
                          f'🌐 *المصدر:* `{source}` | ⏱ `{now_str}`\n\n'
                          f'📌 *العنوان:* {title_ar}\n\n'
                          f'📝 *التفاصيل:* {body_ar}\n'
                          f'━━━━━━━━━━━━━━━━━━\n'
                          f'🔗 [المقال الكامل والمصدر الرسمي]({news_url})'
                      )
                      send_telegram(news_msg)
                      news_index += 1
              except Exception as e:
                  print('News error:', e)

              time.sleep(15)

              # 2. فحص صفقات بينانس ورصد أكبر العملات المتحركة
              try:
                  tickers = get_json('https://fapi.binance.com/fapi/v1/ticker/24hr')
                  usdt_tickers = [t for t in tickers if t['symbol'].endswith('USDT')]
                  usdt_tickers.sort(key=lambda x: float(x['priceChangePercent']), reverse=True)

                  # رصد صفقات الشورت
                  for item in usdt_tickers:
                      symbol = item['symbol']
                      change = float(item['priceChangePercent'])
                      if change >= 5.0:
                          try:
                              klines = get_json(f'https://fapi.binance.com/fapi/v1/klines?symbol={symbol}&interval=15m&limit=50')
                              if len(klines) < 50: continue
                              opens = [float(k[1]) for k in klines]
                              highs = [float(k[2]) for k in klines]
                              closes = [float(k[4]) for k in klines]
                              volumes = [float(k[5]) for k in klines]

                              last_open, last_high, last_close = opens[-1], highs[-1], closes[-1]
                              last_volume = volumes[-1]
                              past_price = closes[-8]
                              pump_pct = ((last_high - past_price) / past_price) * 100
                              avg_vol = sum(volumes[-20:-1]) / 19
                              vol_spike = last_volume / avg_vol if avg_vol > 0 else 1
                              rsi = calculate_rsi(closes)
                              candle_body = abs(last_close - last_open)
                              upper_wick = last_high - max(last_open, last_close)

                              if pump_pct >= 5.0 and vol_spike >= 1.4 and rsi >= 70:
                                  if upper_wick > (candle_body * 0.4) or (last_close < last_high * 0.985):
                                      stop_loss = round(last_high * 1.015, 5)
                                      target_1 = round(last_close - (last_high - past_price) * 0.382, 5)
                                      target_2 = round(last_close - (last_high - past_price) * 0.50, 5)

                                      signal_msg = (
                                          f'🚨 *فرصة شورت استثنائية (Signal Alert)* 🚨\n'
                                          f'👑 *منظومة عبد الحكيم رائد للتحليل الكمي*\n'
                                          f'━━━━━━━━━━━━━━━━━━\n'
                                          f'📌 *العملة:* `#{symbol}`\n'
                                          f'📈 *نسبة الصعود:* `+{pump_pct:.1f}%`\n'
                                          f'📊 *مؤشر RSI:* `{rsi:.1f}`\n'
                                          f'🌊 *تدفق الفوليوم:* `{vol_spike:.1f}x`\n'
                                          f'━━━━━━━━━━━━━━━━━━\n'
                                          f'💰 *سعر الدخول المقترح:* `{last_close}`\n'
                                          f'🛑 *وقف الخسارة (SL):* `{stop_loss}`\n'
                                          f'🎯 *الهدف الأول:* `{target_1}`\n'
                                          f'🎯 *الهدف الثاني:* `{target_2}`\n'
                                          f'━━━━━━━━━━━━━━━━━━\n'
                                          f'💡 *نصيحة عبد الحكيم:* التزم برافعة 3x-5x ومخاطرة 1-2% فقط.'
                                      )
                                      send_telegram(signal_msg)
                                      time.sleep(2)
                                      break
                          except Exception:
                              continue
              except Exception as e:
                  print('Scan error:', e)

              time.sleep(15)
          "
          
